name: CI/CD - democyber

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest

    steps:
      # Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installer Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Compiler le code Java
      - name: Compile Java
        run: mvn compile

      # Construire le .jar
      - name: Build Java project with Maven
        run: mvn clean package

      # Connexion à Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construire l'image Docker
      - name: Build Docker image
        run: docker build -t $DOCKER_IMAGE_NAME .

      # Tester l'image : lancer le conteneur et vérifier qu'il répond
      - name: Test Docker image locally
        run: |
          docker run -d -p 8080:8080 --name democyber $DOCKER_IMAGE_NAME
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080; then
              echo ""
              echo "Application OK"
              docker stop democyber
              exit 0
            fi
            sleep 2
          done
          echo "L'application ne répond pas"
          docker logs democyber
          exit 1

      